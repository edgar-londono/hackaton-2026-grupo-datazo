name: Publish cleaning presentation

on:
  push:
    branches: [main]
    paths:
      - "grupo-datazo/presentation/limpieza_datos.html"
      - "grupo-datazo/output/data_quality.md"
      - "grupo-datazo/output/prepared/duplicados_para_revision.csv"
      - ".github/workflows/publish-cleaning-presentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the site files
        run: |
          mkdir -p _site/presentation _site/output/prepared
          cp grupo-datazo/presentation/limpieza_datos.html _site/presentation/
          cp grupo-datazo/output/data_quality.md _site/output/
          cp grupo-datazo/output/prepared/duplicados_para_revision.csv _site/output/prepared/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
